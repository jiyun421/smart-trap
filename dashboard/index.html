<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트 트랩 위치 추천</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sim-banner" class="sim-banner" role="note" hidden></div>

  <header class="wrap page-head">
    <h1>스마트 트랩 위치 추천</h1>
    <p id="meta" class="meta"></p>
  </header>

  <main class="wrap">
    <p id="status-msg" class="status-msg" role="status">불러오는 중…</p>

    <div id="content" hidden>
      <section aria-labelledby="h-kpi">
        <h2 id="h-kpi" class="sr-only">판정 요약</h2>
        <div id="kpis" class="kpis"></div>
      </section>

      <section aria-labelledby="h-cards">
        <h2 id="h-cards">트랩별 판정</h2>
        <p class="hint">재배치 권고(우선순위 순) → 장치 점검 → 데이터 부족 → 유지 순서로 표시합니다.</p>
        <div id="cards" class="cards"></div>
      </section>

      <section aria-labelledby="h-charts">
        <h2 id="h-charts">트랩별 성과 비교</h2>
        <div class="charts">
          <figure class="chart-box">
            <figcaption>작동 시간당 쥐 감지 빈도</figcaption>
            <div class="chart-frame"><canvas id="chart-rate" role="img" aria-label="트랩별 작동 시간당 쥐 감지 빈도 막대 차트. 아래 표와 같은 값입니다."></canvas></div>
          </figure>
          <figure class="chart-box">
            <figcaption>감지 대비 가상 포획 전환율</figcaption>
            <div class="chart-frame"><canvas id="chart-conv" role="img" aria-label="트랩별 감지 대비 가상 포획 전환율 막대 차트. 아래 표와 같은 값입니다."></canvas></div>
          </figure>
          <figure class="chart-box wide" id="box-score">
            <figcaption>재배치 권고 트랩의 위치 점수 (현재 위치 vs 추천 위치)</figcaption>
            <div class="chart-frame"><canvas id="chart-score" role="img" aria-label="재배치 권고 트랩의 현재 위치와 추천 위치 점수 비교 막대 차트."></canvas></div>
          </figure>
        </div>
        <p id="source-note" class="source"></p>

        <details class="table-view">
          <summary>표로 보기</summary>
          <div class="table-scroll"><table id="table"></table></div>
        </details>
      </section>

      <section class="notes" aria-labelledby="h-notes">
        <h2 id="h-notes">읽는 방법</h2>
        <ul id="notes"></ul>
      </section>
    </div>
  </main>

  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/model.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
